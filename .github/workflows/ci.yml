name: ci

# The pages workflow only runs on push to main, so pull requests (including
# Dependabot's) merged without this would skip tests, lint, and the build.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run lint
      # bun installs, node builds: bun 1.3.14 crashes in next's TypeScript
      # pass, so the build runs on node the same way the deploy does.
      - run: node node_modules/next/dist/bin/next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SITE_URL: https://kacigaya.github.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/postbuild-og.mjs
